<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<meta name="description" content="サーバー不要・アカウント不要でブラウザだけで完結する筋トレ記録アプリ">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
<title>Iron Log - 筋トレ記録</title>
</head>
<body>

<header class="appbar">
  <h1>Iron Log</h1>
  <span class="tagline">端末内だけで完結する筋トレ記録</span>
</header>

<main id="view"></main>

<!-- 休憩タイマーは常に表示する。使うときに探させないため -->
<div id="rest" class="rest" role="status" aria-label="休憩タイマー">
  <div id="rest-fill" class="rest-fill"></div>
  <div class="rest-inner">
    <span class="rest-label">休憩</span>
    <span id="rest-time" class="rest-time">1:30</span>
    <button id="rest-go" class="primary" data-act="rest-start">開始</button>
    <button id="rest-plus" data-act="rest-plus" hidden>+30秒</button>
    <button id="rest-stop" data-act="rest-skip" hidden>終了</button>
  </div>
</div>

<nav class="tabbar" aria-label="メインナビゲーション">
  <button data-tab="log" class="on" aria-current="page">
    <span class="ico" aria-hidden="true">✎</span><span>記録</span>
  </button>
  <button data-tab="history">
    <span class="ico" aria-hidden="true">▦</span><span>履歴</span>
  </button>
  <button data-tab="analytics">
    <span class="ico" aria-hidden="true">◔</span><span>分析</span>
  </button>
  <button data-tab="settings">
    <span class="ico" aria-hidden="true">⚙</span><span>設定</span>
  </button>
</nav>

<div id="modal" class="modal" aria-hidden="true" role="dialog" aria-modal="true"></div>
<div id="toast" class="toast" role="status"></div>
<div id="note" class="toast note-toast" role="status"></div>
<input id="import-file" type="file" accept="application/json,.json" hidden>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/calc.js"></script>
<script src="js/app.js"></script>
</body>
</html>
